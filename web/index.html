<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Família</title>
<!--
  Painel da Família — página única para TV (Chromecast, Android TV, navegador).

  Parâmetros de URL (todos opcionais):
    api     URL do Web App do Google Apps Script (termina em /exec)
    token   segredo configurado no script (TOKEN)
    pessoa  perfil configurado no script: familia, pessoa1, pessoa2, pessoa3...
    lat/lon coordenadas para a previsão do tempo (sem elas, o tempo não aparece)
    cidade  nome exibido junto ao tempo
    fundo   "cobrir" para a foto preencher a tela toda (corta as bordas); sem ele, a foto aparece inteira
  Sem "api", o painel mostra dados de exemplo.
-->
<style>
  :root {
    --bg: #11151c;
    --panel: rgba(14, 18, 25, 0.50);
    --line: rgba(255, 255, 255, 0.10);
    --text: #eef1f5;
    --muted: #93a0b4;
    --accent: #f2b544;
    --today: #4fb38b;
    --late: #ef6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  /* o fundo fica só no html: no body ele cobriria a foto (z-index negativo) */
  body { background: transparent; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
  body { font-family: "Google Sans", Roboto, "Segoe UI", system-ui, sans-serif; font-size: 1.5vw; }

  /* coluna da esquerda sobre o preto; a foto fica à direita (margem de segurança para overscan) */
  #left { position: fixed; left: 2.8vw; top: 3.5vh; bottom: 3vh; width: 33vw; display: flex; flex-direction: column; gap: 1.8vh; }
  body.has-news #left { bottom: calc(6vh + 2.5vh); }
  header { flex: none; }

  /* foto de fundo em tela cheia */
  #bg { position: fixed; top: 0; bottom: 0; right: 0; left: 28vw; z-index: -2; background: var(--bg); }
  #bg .layer, #bg video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2s ease; }
  #bg .layer.show, #bg video.show { opacity: 1; }
  #bg video { object-fit: contain; background: #000; }
  /* foto inteira no centro; nas laterais, a mesma foto bem pequena, ampliada e desfocada */
  #bg .layer img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg .layer .main { object-fit: contain; }
  #bg .layer .fill { object-fit: cover; filter: blur(2vw) brightness(0.55); transform: scale(1.1); }
  .lite #bg .layer .fill { filter: brightness(0.5); }
  #bg.cover .layer .main { object-fit: cover; }
  #bg.cover .layer .fill { display: none; }
  /* preto à esquerda, com degradê até a foto */
  #shade { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 34%, rgba(17,21,28,0.75) 42%, rgba(17,21,28,0.3) 51%, rgba(17,21,28,0) 60%); }
  .hello { font-size: 1.6vw; color: var(--accent); font-weight: 600; margin-bottom: 0.6vh; }
  #clock { font-size: 5vw; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
  #date { font-size: 1.6vw; color: #d5dbe5; margin-top: 0.6vh; }
  #weather { margin-top: 1vh; display: flex; align-items: baseline; gap: 0.9vw; flex-wrap: wrap; }
  #weather .now { font-size: 1.9vw; font-weight: 600; line-height: 1.2; }
  #weather .range { font-size: 1.3vw; color: #d5dbe5; }
  #weather .days { flex-basis: 100%; display: flex; gap: 1.3vw; font-size: 1.15vw; color: #93a0b4; margin-top: 0.3vh; }

  /* os cards ficam sobre o preto: sem desfoque, que pesa no processador da TV */
  .card { background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 1.1vw; padding: 2vh 1.5vw; overflow: hidden; min-height: 0; }

  /* card único com abas: mostra uma de cada vez e troca junto com a foto/vídeo do fundo */
  #panel { flex: 1 1 0; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 1.6vw; margin-bottom: 1.2vh; flex: none; }
  #spotify-card { padding: 1.4vh 1.3vw; }
  #spotify-card h2 { margin-bottom: 0.3vh; }
  .np-bar { margin-top: 0.8vh !important; }
  .tabs span { font-size: 1.05vw; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; color: #5d6778; padding-bottom: 0.5vh; border-bottom: 0.25vh solid transparent; }
  .tabs span.on { color: var(--accent); border-bottom-color: var(--accent); }
  .pane { flex: 1 1 0; min-height: 0; overflow: hidden; display: none; }
  .pane.on { display: block; animation: paneIn 0.6s ease; }
  @keyframes paneIn { from { opacity: 0; } to { opacity: 1; } }

  /* Spotify: tocando agora */
  .np { display: flex; gap: 1.2vw; align-items: center; }
  #np-art { width: 4.6vw; height: 4.6vw; border-radius: 0.6vw; object-fit: cover; flex: none; box-shadow: 0 0.4vw 1.2vw rgba(0,0,0,0.4); background: rgba(255,255,255,0.06); }
  .np-info { flex: 1; min-width: 0; }
  .np-info h2 { margin-bottom: 0.6vh; color: #1ed760; }
  .np-title { font-size: 1.6vw; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist { font-size: 1.35vw; color: #c9d1dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.3vh; }
  .np-bar { height: 0.45vh; background: rgba(255,255,255,0.18); border-radius: 1vh; margin-top: 1.2vh; overflow: hidden; }
  #np-progress { height: 100%; width: 0; background: #1ed760; transition: width 1s linear; }
  .paused #np-progress { background: var(--muted); }
  .more { color: var(--muted); font-style: italic; font-size: 1.25vw; padding-top: 0.4vh; }
  h2 { font-size: 1.15vw; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 600; margin-bottom: 1vh; }

  /* agenda */
  .day { margin-bottom: 1vh; }
  .day-title { font-size: 1.35vw; color: #b9c3d3; font-weight: 600; margin-bottom: 0.4vh; }
  .day.is-today .day-title { color: var(--today); }
  .event { display: flex; align-items: baseline; gap: 0.8vw; padding: 0.6vh 0; border-bottom: 1px solid var(--line); }
  .event:last-child { border-bottom: 0; }
  .event .dot { width: 0.75vw; height: 0.75vw; border-radius: 50%; flex: none; }
  .event .time { width: 5.4vw; flex: none; color: #b9c3d3; font-variant-numeric: tabular-nums; font-size: 1.35vw; }
  .event .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.7vw; }
  .event.past { opacity: 0.55; }


  /* listas */
  ul { list-style: none; }
  li { padding: 0.7vh 0; display: flex; gap: 0.7vw; align-items: baseline; font-size: 1.7vw; border-bottom: 1px solid var(--line); }
  li::before { content: ""; width: 1vw; height: 1vw; border: 2px solid var(--muted); border-radius: 0.25vw; flex: none; transform: translateY(0.12vw); }
  li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .due { margin-left: auto; color: var(--muted); font-size: 1.15vw; white-space: nowrap; }
  li.late .due { color: var(--late); }
  li.more::before { display: none; }
  .two-cols ul { columns: 2; column-gap: 1vw; }
  .two-cols li { break-inside: avoid; }
  .empty { color: var(--muted); font-style: italic; }

  /* cardápio */
  .menu-row { display: flex; gap: 0.8vw; padding: 0.9vh 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .menu-row:last-child { border-bottom: 0; }
  .menu-row .d { width: 3.6vw; flex: none; color: var(--muted); font-weight: 600; font-size: 1.25vw; text-transform: capitalize; }
  .menu-row.is-today .d { color: var(--today); }
  .menu-row .m { flex: 1; min-width: 0; font-size: 1.55vw; }
  .menu-row .m div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-row .m small { color: var(--muted); font-size: 1.1vw; display: inline-block; width: 4.6vw; }

  .hidden { display: none !important; }
  #status { position: fixed; right: 1vw; bottom: 0.6vh; font-size: 0.85vw; color: rgba(255, 255, 255, 0.45); }

  /* barra de notícias no rodapé */
  #news { position: fixed; left: 0; right: 0; bottom: 0; height: 6vh; display: flex; align-items: stretch;
    background: #0b0e13; border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 2; text-shadow: none; }
  #news .tag { flex: none; display: flex; align-items: center; padding: 0 1.4vw 0 2.6vw; background: #d93b3b; color: #fff;
    font-weight: 700; font-size: 1.1vw; letter-spacing: 0.12em; text-transform: uppercase; text-shadow: none; }
  #news .lane { position: relative; flex: 1; overflow: hidden; }
  #news-track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; white-space: nowrap;
    will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  #news-track span { font-size: 1.45vw; }
  #news-track .src { color: var(--accent); font-weight: 700; font-size: 1.05vw; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 0.7vw; }
  #news-track .sep { color: rgba(255, 255, 255, 0.35); margin: 0 1.6vw; }
  body.has-news #status { bottom: calc(6vh + 0.4vh); }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>
  <div id="left">
    <header>
      <div class="hello" id="hello"></div>
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="weather"></div>
    </header>

    <div class="card" id="panel">
      <div class="tabs" id="tabs"></div>
      <div class="pane" id="agenda" data-tab="Agenda"><div id="events"></div></div>
      <div class="pane" id="reminders-card" data-tab="Lembretes"><div id="reminders"></div></div>
      <div class="pane two-cols" id="shopping-card" data-tab="Compras"><div id="shopping"></div></div>
      <div class="pane" id="menu-card" data-tab="Cardápio"><div id="menu"></div></div>
    </div>

    <div class="card hidden" id="spotify-card" style="flex: none">
      <div class="np">
        <img id="np-art" alt="">
        <div class="np-info">
          <h2 id="np-label">Tocando agora</h2>
          <div class="np-title" id="np-title"></div>
          <div class="np-artist" id="np-artist"></div>
          <div class="np-bar"><div id="np-progress"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="status"></div>
  <div id="news" class="hidden"><div class="tag">Notícias</div><div class="lane"><div id="news-track"></div></div></div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var CONFIG = {
    api: params.get("api") || "",
    token: params.get("token") || "",
    pessoa: (params.get("pessoa") || "familia").toLowerCase(),
    lat: params.get("lat") || "",
    lon: params.get("lon") || "",
    cidade: params.get("cidade") || "",
    days: 5,
    refreshDataMs: 5 * 60 * 1000,
    refreshWeatherMs: 30 * 60 * 1000,
    photoEveryMs: 45 * 1000
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  var WEEK = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var WEEK_SHORT = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho",
                "agosto", "setembro", "outubro", "novembro", "dezembro"];

  // ---------- relógio ----------
  var profileName = "";
  function tick() {
    var now = new Date(), h = now.getHours();
    $("clock").textContent = hm(now);
    $("date").textContent = WEEK[now.getDay()] + ", " + now.getDate() + " de " + MONTHS[now.getMonth()];
    var greet = h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
    $("hello").textContent = greet + (profileName ? ", " + profileName : "");
  }

  // ---------- agenda ----------
  function dayLabel(d) {
    var diff = Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);
    if (diff === 0) return "Hoje";
    if (diff === 1) return "Amanhã";
    return WEEK[d.getDay()] + ", " + d.getDate() + "/" + pad(d.getMonth() + 1);
  }

  function renderEvents(events) {
    var now = new Date(), today = startOfDay(now), groups = [], i;
    for (i = 0; i < CONFIG.days; i++) {
      var d = new Date(today); d.setDate(d.getDate() + i);
      groups.push({ date: d, items: [] });
    }
    events.forEach(function (ev) {
      var s = new Date(ev.start), e = new Date(ev.end || ev.start);
      groups.forEach(function (g) {
        var dEnd = new Date(g.date); dEnd.setDate(dEnd.getDate() + 1);
        if ((s < dEnd && e > g.date) || (+s === +e && s >= g.date && s < dEnd)) g.items.push(ev);
      });
    });
    var html = "";
    groups.forEach(function (g, idx) {
      if (idx > 1 && !g.items.length) return; // esconde dias vazios depois de amanhã
      g.items.sort(function (a, b) {
        if (!!a.allDay !== !!b.allDay) return a.allDay ? -1 : 1;
        return new Date(a.start) - new Date(b.start);
      });
      html += '<div class="day' + (idx === 0 ? " is-today" : "") + '"><div class="day-title">' + esc(dayLabel(g.date)) + "</div>";
      if (!g.items.length) html += '<div class="empty">Nada marcado</div>';
      g.items.forEach(function (ev) {
        var past = !ev.allDay && new Date(ev.end || ev.start) < now;
        html += '<div class="event' + (past ? " past" : "") + '"><span class="dot" style="background:' + esc(ev.color || "#7aa2f7") + '"></span>' +
                '<span class="time">' + (ev.allDay ? "dia todo" : hm(new Date(ev.start))) + "</span>" +
                '<span class="title">' + esc(ev.title) + "</span></div>";
      });
      html += "</div>";
    });
    $("events").innerHTML = html;
  }

  // ---------- lembretes e compras ----------
  function renderItems(items, max, withDue) {
    if (!items || !items.length) return '<div class="empty">Tudo feito</div>';
    var today = startOfDay(new Date()), html = "<ul>";
    items.forEach(function (t) {
      var due = "", late = false;
      if (withDue && t.due) {
        var d = startOfDay(new Date(t.due.slice(0, 10) + "T12:00:00")); // Tasks guarda só a data
        late = d < today;
        due = +d === +today ? "hoje" : d.getDate() + "/" + pad(d.getMonth() + 1);
      }
      html += '<li class="' + (late ? "late" : "") + '"><span>' + esc(t.title) + "</span>" +
              (due ? '<span class="due">' + due + "</span>" : "") + "</li>";
    });
    return html + "</ul>";
  }

  // ---------- cardápio ----------
  function renderMenu(menu) {
    if (!menu || !menu.length) { $("menu").innerHTML = ""; return; }
    var todayIdx = new Date().getDay(), html = "";
    // mostra de hoje em diante, até 7 dias
    var ordered = [];
    for (var i = 0; i < 7; i++) {
      var wd = (todayIdx + i) % 7;
      var row = menu.filter(function (m) { return m.weekday === wd; })[0];
      if (row) ordered.push({ wd: wd, row: row, today: i === 0 });
    }
    ordered.forEach(function (o) {
      var parts = [];
      if (o.row.almoco) parts.push("<small>almoço</small>" + esc(o.row.almoco));
      if (o.row.jantar) parts.push("<small>jantar</small>" + esc(o.row.jantar));
      html += '<div class="menu-row' + (o.today ? " is-today" : "") + '"><span class="d">' +
              (o.today ? "hoje" : WEEK_SHORT[o.wd]) + '</span><span class="m">' + (parts.length ? "<div>" + parts.join("</div><div>") + "</div>" : "—") + "</span></div>";
    });
    $("menu").innerHTML = html;
  }

  // ---------- fotos (fundo da tela inteira) ----------
  // Pede a foto no tamanho real da tela (TVs 4K chegam a 3840 px) para não ficar serrilhada.
  var IS_CAST = /CrKey/.test(navigator.userAgent);
  var SCREEN_W = Math.min(3840, Math.round(screen.width * (window.devicePixelRatio || 1)));
  var SCREEN_H = Math.min(2160, Math.round(screen.height * (window.devicePixelRatio || 1)));
  // ?fundo=cobrir: foto preenche a tela toda (corta as bordas). Padrão: foto inteira, sem cortes.
  var PHOTO_COVER = params.get("fundo") === "cobrir";
  if (PHOTO_COVER) $("bg").classList.add("cover");
  var photos = [], photosKey = "", photoIdx = -1, photoTimer = null;
  function setPhotos(list) {
    list = list || [];
    var key = JSON.stringify(list);
    if (!list.length) { photos = []; photosKey = ""; clearTimeout(photoTimer); photoTimer = null; $("bg").innerHTML = ""; return; }
    if (key === photosKey && photoTimer) return; // mesma lista: segue a sequência atual
    photosKey = key;
    photos = list.slice();
    // embaralha para não repetir sempre a mesma sequência
    for (var i = photos.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = photos[i]; photos[i] = photos[j]; photos[j] = t; }
    photoIdx = -1;
    clearTimeout(photoTimer);
    nextPhoto();
  }
  function scheduleNext(ms) {
    clearTimeout(photoTimer);
    photoTimer = setTimeout(nextPhoto, ms);
  }
  // troca o item de fundo com transição suave e remove o anterior
  function showLayer(el) {
    var box = $("bg");
    box.appendChild(el);
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add("show"); }); });
    var old = box.children;
    setTimeout(function () {
      while (box.children.length > 1 && box.firstChild !== el) {
        var f = box.firstChild;
        if (f.tagName === "VIDEO") releaseVideo(f);
        f.remove();
      }
    }, 2200);
  }
  // Vídeo do álbum: só aparece depois de baixado, para não travar no meio. Enquanto isso, a foto
  // anterior continua na tela. Toca sem som e passa para o próximo item quando acaba (máx. 2 min).
  // No Chromecast antigo, que não aguenta bem, mostra só o primeiro quadro como foto.
  var VIDEO_MAX_BYTES = 150 * 1024 * 1024;
  var videoPrep = {}, bgGen = 0;
  function fetchVideoBlob(url) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 3 * 60 * 1000);
    return fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      if ((+r.headers.get("content-length") || 0) > VIDEO_MAX_BYTES) throw new Error("vídeo grande demais");
      return r.blob();
    }).then(function (b) {
      clearTimeout(t);
      if (!/^video\//.test(b.type) || b.size > VIDEO_MAX_BYTES) throw new Error("não é um vídeo");
      return URL.createObjectURL(b);
    }, function (e) { clearTimeout(t); throw e; });
  }
  // cria o elemento e espera até o navegador dizer que consegue tocar até o fim sem parar
  function bufferVideo(src, ms) {
    return new Promise(function (resolve, reject) {
      var v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto";
      v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
      var timer = setTimeout(fail, ms);
      function fail() { clearTimeout(timer); v.removeAttribute("src"); v.load(); reject(new Error("vídeo não carregou")); }
      v.addEventListener("canplaythrough", function () { clearTimeout(timer); resolve(v); }, { once: true });
      v.addEventListener("error", fail, { once: true });
      v.src = src;
      v.load();
    });
  }
  function prepareVideo(p) {
    if (videoPrep[p.video]) return videoPrep[p.video];
    var hd = p.video.replace(/=dv$/, "=m37"); // versão 1080p do Google Fotos, mais leve que o original
    var pr = fetchVideoBlob(hd).catch(function () { return fetchVideoBlob(p.video); }).then(function (blobUrl) {
      return bufferVideo(blobUrl, 30000).then(function (v) { v._blob = blobUrl; return v; },
        function (e) { URL.revokeObjectURL(blobUrl); throw e; });
    }).catch(function () {
      // sem permissão para baixar o arquivo: deixa o próprio player carregar o suficiente
      return bufferVideo(hd, 60000).catch(function () { return bufferVideo(p.video, 90000); });
    });
    videoPrep[p.video] = pr;
    return pr;
  }
  function releaseVideo(v) {
    v.pause(); v.removeAttribute("src"); v.load();
    if (v._blob) { URL.revokeObjectURL(v._blob); v._blob = null; }
  }
  function playVideo(p, gen) {
    var gaveUp = false;
    // se em 4 minutos não ficou pronto, mostra o primeiro quadro como foto
    clearTimeout(photoTimer);
    photoTimer = setTimeout(function () { gaveUp = true; delete videoPrep[p.video]; showStill(p); }, 4 * 60 * 1000);
    prepareVideo(p).then(function (v) {
      delete videoPrep[p.video];
      if (gaveUp || gen !== bgGen) { releaseVideo(v); return; }
      var done = false;
      function next() { if (!done) { done = true; if (gen === bgGen) scheduleNext(0); } }
      v.addEventListener("ended", next);
      v.addEventListener("error", next);
      showLayer(v);
      v.play().catch(function () {});
      scheduleNext(Math.min(120, (isFinite(v.duration) && v.duration ? v.duration : 120) + 5) * 1000);
    }, function () {
      delete videoPrep[p.video];
      if (!gaveUp && gen === bgGen) showStill(p);
    });
  }
  // baixa o próximo vídeo da fila enquanto o item atual está na tela
  function prefetchNext() {
    if (IS_CAST || photos.length < 2) return;
    var n = photos[(photoIdx + 1) % photos.length];
    if (n && n.video) prepareVideo(n).catch(function () {});
  }
  function showStill(p) {
    photoUrl(p).then(function (src) {
      if (!src) return;
      var layer = document.createElement("div");
      layer.className = "layer";
      var img = new Image();
      img.className = "main";
      img.decoding = "async";
      img.onload = function () {
        if (!PHOTO_COVER) {
          var fill = new Image();
          fill.className = "fill";
          fill.src = /googleusercontent\.com/.test(src) ? src.replace(/=[^=\/]*$/, "=w96-h54-c") : src;
          layer.appendChild(fill);
        }
        layer.appendChild(img);
        showLayer(layer);
      };
      img.src = src;
    }).catch(function () {});
    scheduleNext(CONFIG.photoEveryMs);
  }
  function photoUrl(p) {
    if (p.url) {
      // álbum do Google Fotos: troca o sufixo de tamanho (=w1280-h800) pelo da tela
      if (/googleusercontent\.com/.test(p.url)) {
        // sem "-c" o Google devolve a foto inteira cabendo na tela; com "-c", recortada para preencher
        return Promise.resolve(p.url.replace(/=[^=\/]*$/, "") + "=w" + SCREEN_W + "-h" + SCREEN_H + (PHOTO_COVER ? "-c" : ""));
      }
      return Promise.resolve(p.url);
    }
    // fotos do Google Drive chegam como data URL pedida ao script
    return fetch(apiUrl({ foto: p.id, w: SCREEN_W })).then(function (r) { return r.json(); }).then(function (j) { return j.dataUrl; });
  }
  function nextPhoto() {
    if (!photos.length) return;
    photoIdx = (photoIdx + 1) % photos.length;
    var p = photos[photoIdx];
    bgGen++;
    if (p.video && !IS_CAST) playVideo(p, bgGen); else showStill(p);
    rotatePanel();
    prefetchNext();
  }

  // ---------- encaixe: nada é cortado no fim dos cards ----------
  // Remove os últimos itens até o card caber e mostra "+ N ..." no lugar.
  function fit(card, list, selector, noun) {
    if (!card || !list) return;
    // pode rodar mais de uma vez (ex.: o tempo carregou depois): soma com o que já foi escondido
    var old = list.querySelector(".more"), hidden = old ? +old.getAttribute("data-n") || 0 : 0;
    if (old) old.remove();
    var items = list.querySelectorAll(selector), more = null;
    function addMore() { more = document.createElement(list.tagName === "UL" ? "li" : "div"); more.className = "more"; list.appendChild(more); }
    if (hidden) { addMore(); more.textContent = "+ " + hidden + " " + noun; }
    for (var i = items.length - 1; i > 0 && card.scrollHeight > card.clientHeight + 1; i--) {
      var it = items[i], parent = it.parentNode;
      parent.removeChild(it);
      hidden++;
      // dia da agenda que ficou sem eventos some junto
      if (parent.classList && parent.classList.contains("day") && !parent.querySelector(selector)) parent.remove();
      if (!more) addMore();
      more.textContent = "+ " + hidden + " " + noun;
    }
    if (more) more.setAttribute("data-n", hidden);
  }
  // só dá para medir a aba que está visível; as outras são ajustadas quando aparecem
  // Redesenha a aba com os dados mais recentes e corta o que não couber; assim também volta a
  // mostrar mais itens se o espaço aumentar (ex.: o card do Spotify sumiu).
  var lastData = null;
  function fitPane(pane) {
    if (!pane) return;
    if (lastData) {
      if (pane.id === "agenda") renderEvents(lastData.events || []);
      if (pane.id === "reminders-card") $("reminders").innerHTML = renderItems(lastData.reminders, 8, true);
      if (pane.id === "shopping-card" && lastData.shopping) $("shopping").innerHTML = renderItems(lastData.shopping, 12, false);
      if (pane.id === "menu-card") renderMenu(lastData.menu);
    }
    if (pane.id === "agenda") fit(pane, $("events"), ".event", "eventos");
    if (pane.id === "reminders-card") fit(pane, $("reminders").querySelector("ul"), "li", "itens");
    if (pane.id === "shopping-card") fit(pane, $("shopping").querySelector("ul"), "li", "itens");
    if (pane.id === "menu-card") fit(pane, $("menu"), ".menu-row", "dias");
  }
  function fitAll() { fitPane(document.querySelector(".pane.on")); }
  if (window.ResizeObserver) {
    var fitQueued = false;
    new ResizeObserver(function () {
      if (fitQueued) return;
      fitQueued = true;
      requestAnimationFrame(function () { fitQueued = false; fitAll(); });
    }).observe($("panel"));
  }

  // ---------- card com abas ----------
  // Troca de aba a cada foto ou vídeo novo no fundo (sem fotos, a cada 45 s). Abas vazias são puladas.
  var paneIdx = -1, paneTimer = null;
  function panes() {
    return Array.prototype.filter.call(document.querySelectorAll(".pane"), function (p) {
      if (p.id === "agenda") return true;
      return !!p.textContent.trim() && !p.querySelector(".empty");
    });
  }
  function showPane(idx) {
    var list = panes();
    if (!list.length) return;
    paneIdx = ((idx % list.length) + list.length) % list.length;
    var cur = list[paneIdx];
    Array.prototype.forEach.call(document.querySelectorAll(".pane"), function (p) { p.classList.toggle("on", p === cur); });
    $("tabs").innerHTML = list.map(function (p) {
      return '<span class="' + (p === cur ? "on" : "") + '">' + esc(p.getAttribute("data-tab")) + "</span>";
    }).join("");
    fitPane(cur);
  }
  function rotatePanel() {
    showPane(paneIdx + 1);
    clearTimeout(paneTimer);
    if (!photos.length) paneTimer = setTimeout(rotatePanel, CONFIG.photoEveryMs);
  }
  // depois de atualizar os dados: mantém a aba atual (ou a próxima, se ela ficou vazia)
  function refreshPanel() {
    var cur = document.querySelector(".pane.on");
    var list = panes(), i = cur ? list.indexOf(cur) : -1;
    showPane(i >= 0 ? i : Math.max(paneIdx, 0));
    if (!photos.length && !paneTimer) paneTimer = setTimeout(rotatePanel, CONFIG.photoEveryMs);
  }

  // ---------- Spotify: tocando agora ----------
  // Consulta a cada 15 s enquanto toca e a cada 60 s parado; a barra anda sozinha entre as consultas.
  var np = null, npTimer = null, npEnabled = false;
  function loadNowPlaying() {
    if (!npEnabled || !CONFIG.api) return;
    fetch(apiUrl({ spotify: "now" })).then(function (r) { return r.json(); }).then(function (j) {
      np = j.spotify ? Object.assign({ at: Date.now() }, j.spotify) : null;
      renderNowPlaying();
      clearTimeout(npTimer);
      npTimer = setTimeout(loadNowPlaying, np && np.playing ? 15000 : 60000);
    }).catch(function () { clearTimeout(npTimer); npTimer = setTimeout(loadNowPlaying, 60000); });
  }
  function renderNowPlaying() {
    var card = $("spotify-card");
    // só aparece tocando, ou pausado há pouco tempo
    var show = !!np && (np.playing || Date.now() - np.at <= 10 * 60 * 1000);
    if (show === card.classList.contains("hidden") && !window.ResizeObserver) setTimeout(fitAll, 0); // o card de cima muda de altura
    if (!show) { card.classList.add("hidden"); return; }
    card.classList.remove("hidden");
    card.classList.toggle("paused", !np.playing);
    $("np-label").textContent = np.playing ? "Tocando agora" : "Pausado";
    $("np-title").textContent = np.title || "";
    $("np-artist").textContent = np.artist || "";
    if (np.image && $("np-art").getAttribute("src") !== np.image) $("np-art").src = np.image;
    tickNowPlaying();
  }
  function tickNowPlaying() {
    if (!np || !np.durationMs) return;
    var pos = np.progressMs + (np.playing ? Date.now() - np.at : 0);
    $("np-progress").style.width = Math.min(100, pos / np.durationMs * 100) + "%";
    // música acabou antes da próxima consulta: pergunta de novo
    if (np.playing && pos > np.durationMs + 2000) { np.playing = false; clearTimeout(npTimer); npTimer = setTimeout(loadNowPlaying, 1000); }
  }
  setInterval(tickNowPlaying, 1000);
  function setSpotify(enabled) {
    var was = npEnabled;
    npEnabled = !!enabled;
    if (npEnabled && !was) loadNowPlaying();
    if (!npEnabled) { clearTimeout(npTimer); np = null; renderNowPlaying(); }
  }

  // ---------- barra de notícias ----------
  // A cada volta completa, embaralha as manchetes de novo (as fontes ficam misturadas).
  var news = [], newsRunning = false;
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function setNews(list) {
    news = (list || []).filter(function (n) { return n && n.title; });
    var on = news.length > 0;
    $("news").classList.toggle("hidden", !on);
    document.body.classList.toggle("has-news", on);
    if (!window.ResizeObserver) setTimeout(fitAll, 0);
    if (on && !newsRunning) runNews();
  }
  function runNews() {
    var track = $("news-track");
    if (!news.length) { newsRunning = false; return; }
    newsRunning = true;
    track.innerHTML = shuffle(news).slice(0, 30).map(function (n) {
      return (n.source ? '<span class="src">' + esc(n.source) + "</span>" : "") + "<span>" + esc(n.title) + '</span><span class="sep">•</span>';
    }).join("");
    var lane = track.parentNode.clientWidth, w = track.scrollWidth;
    var speed = window.innerWidth / 24; // pixels por segundo (uma tela a cada 24 s)
    track.style.transition = "none";
    track.style.transform = "translate3d(" + lane + "px,0,0)";
    void track.offsetWidth; // aplica a posição inicial antes de animar
    track.style.transition = "transform " + ((lane + w) / speed).toFixed(1) + "s linear";
    track.style.transform = "translate3d(" + (-w) + "px,0,0)";
  }
  $("news-track").addEventListener("transitionend", runNews);

  // ---------- tempo (Open-Meteo, sem chave) ----------
  function wmo(code) {
    if (code === 0) return ["☀️", "céu limpo"];
    if (code <= 2) return ["🌤️", "poucas nuvens"];
    if (code === 3) return ["☁️", "nublado"];
    if (code <= 48) return ["🌫️", "neblina"];
    if (code <= 57) return ["🌦️", "garoa"];
    if (code <= 67) return ["🌧️", "chuva"];
    if (code <= 77) return ["❄️", "neve"];
    if (code <= 82) return ["🌧️", "pancadas"];
    return ["⛈️", "tempestade"];
  }
  function loadWeather() {
    if (!CONFIG.lat || !CONFIG.lon) { $("weather").innerHTML = ""; return; }
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.lat + "&longitude=" + CONFIG.lon +
      "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=4";
    return fetch(url).then(function (r) { return r.json(); }).then(function (w) {
      var now = wmo(w.current.weather_code), d = w.daily, days = "";
      for (var i = 1; i < d.time.length; i++) {
        var dt = new Date(d.time[i] + "T12:00:00");
        days += "<span>" + WEEK_SHORT[dt.getDay()] + " " + wmo(d.weather_code[i])[0] + " " + Math.round(d.temperature_2m_max[i]) + "°</span>";
      }
      $("weather").innerHTML =
        '<div class="now">' + now[0] + " " + Math.round(w.current.temperature_2m) + "°</div>" +
        '<div class="range">' + (CONFIG.cidade ? esc(CONFIG.cidade) + " · " : "") + now[1] + " · " +
        Math.round(d.temperature_2m_min[0]) + "° / " + Math.round(d.temperature_2m_max[0]) + "° · chuva " +
        d.precipitation_probability_max[0] + "%</div>" +
        '<div class="days">' + days + "</div>";
      fitAll(); // o cabeçalho mudou de altura
    }).catch(function () { /* mantém o último tempo exibido */ });
  }

  // ---------- dados ----------
  function apiUrl(extra) {
    var q = new URLSearchParams({ token: CONFIG.token, pessoa: CONFIG.pessoa, days: CONFIG.days, _: Date.now() });
    Object.keys(extra || {}).forEach(function (k) { q.set(k, extra[k]); });
    return CONFIG.api + (CONFIG.api.indexOf("?") === -1 ? "?" : "&") + q.toString();
  }

  var lastOk = 0;
  function loadData() {
    if (!CONFIG.api) { render(demoData(CONFIG.pessoa)); return; }
    fetch(apiUrl()).then(function (r) { return r.json(); }).then(function (data) {
      if (data.error) throw new Error(data.error);
      render(data);
    }).catch(function (err) {
      $("status").textContent = "sem conexão com a agenda" + (lastOk ? " · última atualização " + hm(new Date(lastOk)) : "") + " · " + err.message;
    });
  }

  function render(data) {
    lastData = data;
    profileName = data.name || "";
    tick();
    renderEvents(data.events || []);
    $("reminders").innerHTML = renderItems(data.reminders, 8, true);
    $("shopping").innerHTML = renderItems(data.shopping, 12, false);
    if (!data.shopping) $("shopping").innerHTML = "";
    renderMenu(data.menu);
    setPhotos(data.photos || []);
    setSpotify(data.spotify);
    setNews(data.news);
    if (data.spotifyDemo) { np = Object.assign({ at: Date.now() }, data.spotifyDemo); renderNowPlaying(); }
    refreshPanel();
    lastOk = Date.now();
    $("status").textContent = (data.demo ? "dados de exemplo · " : "") + "atualizado às " + hm(new Date()) +
      (data.warnings && data.warnings.length ? " · aviso: " + data.warnings.join(" | ") : "");
  }

  // ---------- dados de exemplo (sem "api") ----------
  function demoData(pessoa) {
    var t = startOfDay(new Date());
    function at(o, h, m) { var d = new Date(t); d.setDate(d.getDate() + o); d.setHours(h, m || 0); return d.toISOString(); }
    function day(o) { var d = new Date(t); d.setDate(d.getDate() + o); return d.toISOString(); }
    function due(o) { return dayKey(new Date(t.getTime() + o * 86400000)) + "T00:00:00.000Z"; }
    var C = { familia: "#4fb38b", pessoa1: "#7aa2f7", pessoa2: "#e8768a", pessoa3: "#f2b544" };
    var events = [
      { who: "pessoa3", title: "Natação", start: at(0, 8, 30), end: at(0, 9, 30) },
      { who: "familia", title: "Almoço em família", start: at(0, 12, 30), end: at(0, 14) },
      { who: "pessoa2", title: "Pilates", start: at(0, 18), end: at(0, 19) },
      { who: "familia", title: "Aniversário", start: day(1), end: day(2), allDay: true },
      { who: "pessoa1", title: "Dentista", start: at(1, 10), end: at(1, 11) },
      { who: "pessoa3", title: "Prova de matemática", start: day(2), end: day(3), allDay: true },
      { who: "familia", title: "Reunião de pais na escola", start: at(2, 19), end: at(2, 20) },
      { who: "pessoa2", title: "Consulta médica", start: at(3, 15), end: at(3, 16) },
      { who: "pessoa1", title: "Futebol", start: at(3, 18, 30), end: at(3, 20) }
    ];
    var reminders = {
      familia: [{ title: "Pagar conta de luz", due: due(-1) }, { title: "Levar o lixo reciclável", due: due(0) }, { title: "Renovar seguro do carro", due: due(4) }, { title: "Ligar para o encanador" }],
      pessoa1: [{ title: "Pagar conta de luz", due: due(-1) }, { title: "Renovar seguro do carro", due: due(4) }, { title: "Trocar óleo do carro" }],
      pessoa2: [{ title: "Comprar presente de aniversário", due: due(0) }, { title: "Agendar vacina", due: due(2) }],
      pessoa3: [{ title: "Estudar para a prova", due: due(1) }, { title: "Levar a mochila da natação", due: due(0) }, { title: "Arrumar o quarto" }]
    };
    var names = { familia: "", pessoa1: "Pessoa 1", pessoa2: "Pessoa 2", pessoa3: "Pessoa 3" };
    var p = names.hasOwnProperty(pessoa) ? pessoa : "familia";
    var photo = function (seed) { return { url: "https://picsum.photos/seed/" + seed + "/1280/800" }; };
    return {
      name: names[p],
      events: events.filter(function (e) { return p === "familia" || e.who === p || e.who === "familia"; })
                    .map(function (e) { e.color = C[e.who]; return e; }),
      reminders: reminders[p],
      shopping: p === "pessoa3" ? null : [{ title: "Leite" }, { title: "Pão integral" }, { title: "Bananas" }, { title: "Café" },
                 { title: "Detergente" }, { title: "Ovos" }, { title: "Queijo" }, { title: "Arroz" }],
      menu: [
        { weekday: 0, almoco: "Churrasco", jantar: "Sopa de legumes" },
        { weekday: 1, almoco: "Frango grelhado", jantar: "Omelete" },
        { weekday: 2, almoco: "Strogonoff", jantar: "Sanduíche natural" },
        { weekday: 3, almoco: "Feijoada", jantar: "Caldo verde" },
        { weekday: 4, almoco: "Peixe assado", jantar: "Panqueca" },
        { weekday: 5, almoco: "Lasanha", jantar: "Pizza caseira" },
        { weekday: 6, almoco: "Macarronada", jantar: "Lanche" }
      ],
      photos: [photo("familia1"), photo("praia2"), photo("parque3")],
      news: [
        { source: "Esportes", title: "Time vence fora de casa e sobe na tabela" },
        { source: "Esportes", title: "Técnico confirma escalação para o clássico de domingo" },
        { source: "Economia", title: "Bolsa fecha em alta puxada por bancos" },
        { source: "Economia", title: "Dólar recua e termina o dia abaixo de R$ 5" },
        { source: "Esportes", title: "Seleção divulga convocados para as eliminatórias" },
        { source: "Economia", title: "Inflação do mês vem abaixo do esperado" }
      ],
      spotifyDemo: { playing: true, title: "Nome da música", artist: "Artista", image: null, progressMs: 95000, durationMs: 210000 },
      demo: true
    };
  }

  // ---------- Chromecast: mantém o receptor aberto ----------
  if (/CrKey/.test(navigator.userAgent)) {
    document.documentElement.className += " lite";
    var s = document.createElement("script");
    s.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
    s.onload = function () {
      cast.framework.CastReceiverContext.getInstance().start({ disableIdleTimeout: true, skipPlayersLoad: true });
    };
    document.head.appendChild(s);
  }

  // ---------- inicialização ----------
  tick();
  setInterval(tick, 1000);
  loadData();
  setInterval(loadData, CONFIG.refreshDataMs);
  loadWeather();
  setInterval(loadWeather, CONFIG.refreshWeatherMs);
  // recarrega uma vez por dia de madrugada (TVs fracas acumulam memória)
  setInterval(function () { var n = new Date(); if (n.getHours() === 4 && n.getMinutes() === 0) location.reload(); }, 60000);
})();
</script>
