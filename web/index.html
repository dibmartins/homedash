<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Great+Vibes&family=Cormorant+Garamond:wght@500&display=swap">
<script src="versiculos.js"></script>
<title>Painel da Família</title>
<!--
  Painel da Família — página única para TV (Chromecast, Android TV, navegador).

  Parâmetros de URL (todos opcionais):
    api     URL do Web App do Google Apps Script (termina em /exec)
    token   segredo configurado no script (TOKEN)
    pessoa  perfil configurado no script: familia, pessoa1, pessoa2, pessoa3...
    lat/lon coordenadas para a previsão do tempo (sem elas, o tempo não aparece)
    cidade  nome exibido junto ao tempo
    fundo   "cobrir" para a foto preencher a tela toda (corta as bordas); sem ele, a foto aparece inteira
  Sem "api", o painel mostra dados de exemplo.
-->
<style>
  :root {
    --bg: #11151c;
    --panel: rgba(14, 18, 25, 0.50);
    --line: rgba(255, 255, 255, 0.10);
    --text: #eef1f5;
    --muted: #93a0b4;
    --accent: #f2b544;
    --today: #4fb38b;
    --late: #ef6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  /* o fundo fica só no html: no body ele cobriria a foto (z-index negativo) */
  body { background: transparent; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45); }
  body { font-family: "Google Sans", Roboto, "Segoe UI", system-ui, sans-serif; font-size: 1.5vw; }

  /* coluna da esquerda sobre o preto; a foto fica à direita (margem de segurança para overscan) */
  #left { position: fixed; left: 2.8vw; top: 3.5vh; bottom: 3vh; width: 42.2vw; display: flex; flex-direction: column; gap: 1.8vh; }
  body.has-news #left { bottom: calc(6vh + 2.5vh); }
  /* relógio e data à esquerda, tempo no canto direito */
  header { flex: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 1.5vw; }
  header .when { flex: none; white-space: nowrap; }

  /* foto de fundo em tela cheia */
  #bg { position: fixed; top: 0; bottom: 0; right: 0; left: 45vw; z-index: -2; background: var(--bg); }
  #bg .layer, #bg video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2s ease; }
  #bg .layer.show, #bg video.show { opacity: 1; }
  #bg video { object-fit: contain; background: #000; }
  /* app da TV: o vídeo toca no player do Android, por trás da página, que fica transparente ali */
  .nv, .nv body, .nv #bg { background: transparent !important; }
  /* foto inteira no centro; nas laterais, a mesma foto bem pequena, ampliada e desfocada */
  #bg .layer img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg .layer .main { object-fit: contain; }
  #bg .layer .fill { object-fit: cover; filter: blur(2vw) brightness(0.55); transform: scale(1.1); }
  .lite #bg .layer .fill { filter: brightness(0.5); }
  /* modo leve (Chromecast antigo, 512 MB): troca de foto sem esmaecer, sem sombras e sem a cópia
     desfocada da foto nas laterais; cada uma dessas coisas ocupa memória de vídeo */
  .lite #bg .layer, .lite #shade, .lite #shade2 { transition: none; }
  .lite body, .lite #verse .vt, .lite #verse .vr { text-shadow: none; }
  .lite #bg .duo figure, .lite #np-art { box-shadow: none; }
  .lite #bg .duo { background: #1a1612; }
  #bg.cover .layer .main { object-fit: cover; }
  #bg.cover .layer .fill { display: none; }
  /* preto à esquerda, com degradê até a foto */
  #shade, #shade2 { position: fixed; inset: 0; z-index: -1; pointer-events: none; transition: opacity 2s ease; }
  #shade { background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 45%, rgba(17,21,28,0.75) 51%, rgba(17,21,28,0.3) 58%, rgba(17,21,28,0) 65%); }
  /* com duas fotos o degradê é mais curto, para não escurecer a primeira */
  #shade2 { opacity: 0; background: linear-gradient(90deg, var(--bg) 0, var(--bg) 45vw, rgba(17,21,28,0) 48vw); }
  body.duo #shade { opacity: 0; }
  body.duo #shade2 { opacity: 1; }
  /* fotos em pé: duas, lado a lado, em molduras de Polaroid levemente tortas */
  #bg .duo { background: radial-gradient(ellipse at 60% 50%, #3a3026, #14110e 75%); }
  #bg .duo figure { position: absolute; margin: 0; width: 21vw; padding: 0.9vw 0.9vw 4.4vw; background: #fbfaf6;
    box-shadow: 0 1.2vw 2.5vw rgba(0,0,0,0.8); }
  #bg .duo figure img { position: static; display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; background: #ddd; }
  #bg .duo figcaption { position: absolute; left: 0; right: 0; bottom: 1.1vw; text-align: center; color: #444;
    font: 500 1.9vw/1 Caveat, "Segoe Script", "Comic Sans MS", cursive; }
  .hello { font-size: 1.6vw; color: var(--accent); font-weight: 600; margin-bottom: 0.6vh; }
  #clock { font-size: 5vw; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
  #date { font-size: 1.6vw; color: #d5dbe5; margin-top: 0.6vh; }
  #weather { margin-top: 1.2vh; display: flex; flex-direction: column; align-items: flex-end; gap: 0.4vh; text-align: right; min-width: 0; }
  #weather .now { font-size: 3.2vw; font-weight: 600; line-height: 1; white-space: nowrap; }
  #weather .range { font-size: 1.2vw; color: #d5dbe5; line-height: 1.3; }
  #weather .range div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #weather .wi { width: 1.25em; height: 1.25em; vertical-align: -0.25em; overflow: visible; }
  #weather .days { display: flex; gap: 1vw; font-size: 1.1vw; color: #93a0b4; justify-content: flex-end; white-space: nowrap; }

  /* os cards ficam sobre o preto: sem desfoque, que pesa no processador da TV */
  .card { background: rgba(255, 255, 255, 0.045); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 1.1vw; padding: 2vh 1.5vw; overflow: hidden; min-height: 0; }

  /* agenda e cardápio de hoje, lado a lado; nada é cortado: se a agenda não couber, vira páginas */
  #panel { flex: 1 1 0; display: flex; gap: 1.2vw; min-height: 0; }
  #agenda { flex: 1.25 1 0; position: relative; }
  #menu-card { flex: 1 1 0; }
  .lbl { font-size: 1.05vw; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; color: var(--accent); margin-bottom: 1vh; }
  .pg { position: absolute; right: 1.5vw; top: 2vh; font-size: 1vw; color: #93a0b4; letter-spacing: 0.1em; }
  #spotify-card { padding: 1.4vh 1.3vw; }
  #spotify-card h2 { margin-bottom: 0.3vh; }
  .np-bar { margin-top: 0.8vh !important; }
  #events.turn, #panel.turn, #gospel-card.turn { animation: paneIn 0.6s ease; }
  @keyframes paneIn { from { opacity: 0; } to { opacity: 1; } }

  /* Spotify: tocando agora */
  .np { display: flex; gap: 1.2vw; align-items: center; }
  #np-art { width: 4.6vw; height: 4.6vw; border-radius: 0.6vw; object-fit: cover; flex: none; box-shadow: 0 0.4vw 1.2vw rgba(0,0,0,0.4); background: rgba(255,255,255,0.06); }
  .np-info { flex: 1; min-width: 0; }
  .np-info h2 { margin-bottom: 0.6vh; color: #1ed760; }
  .np-title { font-size: 1.6vw; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist { font-size: 1.35vw; color: #c9d1dd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.3vh; }
  .np-bar { height: 0.45vh; background: rgba(255,255,255,0.18); border-radius: 1vh; margin-top: 1.2vh; overflow: hidden; }
  #np-progress { height: 100%; width: 0; background: #1ed760; transition: width 1s linear; }
  .paused #np-progress { background: var(--muted); }
  .more { color: var(--muted); font-style: italic; font-size: 1.25vw; padding-top: 0.4vh; }
  h2 { font-size: 1.15vw; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 600; margin-bottom: 1vh; }

  /* agenda */
  .day-title { font-size: 1.35vw; color: #b9c3d3; font-weight: 600; margin: 0.8vh 0 0.3vh; }
  .event { display: flex; align-items: baseline; gap: 0.8vw; padding: 0.45vh 0; border-bottom: 1px solid var(--line); }
  .event .dot { width: 0.75vw; height: 0.75vw; border-radius: 50%; flex: none; }
  .event .time { width: 5.4vw; flex: none; white-space: nowrap; color: #b9c3d3; font-variant-numeric: tabular-nums; font-size: 1.25vw; }
  .event .title { flex: 1; min-width: 0; font-size: 1.5vw; line-height: 1.2; overflow-wrap: break-word; }
  .event.past { opacity: 0.55; }


  /* listas */
  ul { list-style: none; }
  li { padding: 0.7vh 0; display: flex; gap: 0.7vw; align-items: baseline; font-size: 1.7vw; border-bottom: 1px solid var(--line); }
  li::before { content: ""; width: 1vw; height: 1vw; border: 2px solid var(--muted); border-radius: 0.25vw; flex: none; transform: translateY(0.12vw); }
  li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .due { margin-left: auto; color: var(--muted); font-size: 1.15vw; white-space: nowrap; }
  li.late .due { color: var(--late); }
  li.more::before { display: none; }
  .two-cols ul { columns: 2; column-gap: 1vw; }
  .two-cols li { break-inside: avoid; }
  .empty { color: var(--muted); font-style: italic; }

  /* cardápio */
  .meal + .meal { margin-top: 2vh; }
  .meal span { display: block; color: #93a0b4; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1vw; margin-bottom: 0.4vh; }
  .meal b { display: block; font-weight: 500; font-size: 1.6vw; line-height: 1.25; overflow-wrap: break-word; }

  .hidden { display: none !important; }

  /* versículo do dia: na base da foto, em letra manuscrita */
  #verse { position: fixed; left: 45vw; right: 0; bottom: 0; padding: 12vh 3vw 3vh; text-align: center; z-index: 1; pointer-events: none;
    background: linear-gradient(0deg, rgba(8,10,14,0.85), rgba(8,10,14,0.6) 55%, rgba(8,10,14,0)); }
  body.has-news #verse { bottom: 6vh; }
  .lite body.has-news #verse { bottom: 8.8vh; }
  #verse .vt { font: 400 2.7vw/1.12 "Great Vibes", "Segoe Script", cursive; color: #fbf3df; text-shadow: 0 0.2vw 0.9vw rgba(0,0,0,0.9); }
  #verse .vr { margin-top: 1vh; font: 500 1.05vw "Cormorant Garamond", Georgia, serif; letter-spacing: 0.25em; text-transform: uppercase; color: #e3c27a; text-shadow: 0 0 0.6vw #000; }
  /* com o versículo, as duas Polaroids sobem e diminuem um pouco para não ficar por baixo dele */
  body.has-verse #bg .duo figure { width: 18.5vw; margin-top: -10vh; }

  /* evangelho do dia: reveza com a agenda e o cardápio */
  #gospel-card { flex: 1 1 0; text-shadow: none; }
  #gospel-card .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; }
  #gospel-card .gh span { font-size: 1vw; color: #93a0b4; white-space: nowrap; }
  #gospel-card .lbl { color: #e3c27a; }
  #gospel-day { font-size: 1.05vw; color: #93a0b4; margin: -0.4vh 0 0.8vh; }
  #gospel-text { line-height: 1.42; color: #dfe5ee; font-size: 1.1vw; }

  /* lembrete do lixo: aparece na véspera e na manhã da coleta */
  #trash { flex: none; display: flex; align-items: center; gap: 1.1vw; padding: 1.5vh 1.3vw; border-radius: 1.1vw;
    background: rgba(242, 181, 68, 0.13); border: 1px solid rgba(242, 181, 68, 0.45); }
  #trash svg { width: 3vw; height: 3vw; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #trash .t1 { font-size: 1.75vw; font-weight: 700; line-height: 1.2; }
  #trash .t2 { font-size: 1.3vw; color: #e6dcc6; margin-top: 0.3vh; line-height: 1.3; }
  #trash.today { background: var(--accent); border-color: var(--accent); color: #1b1607; text-shadow: none; }
  #trash.today svg { stroke: #1b1607; }
  #trash.today .t2 { color: #3a2f12; }
  #status { position: fixed; right: 1vw; top: 0.8vh; font-size: 0.85vw; color: rgba(255, 255, 255, 0.45); }

  /* barra de notícias no rodapé */
  #news { position: fixed; left: 0; right: 0; bottom: 0; height: 6vh; display: flex; align-items: stretch;
    background: #0b0e13; border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 2; text-shadow: none; }
  #news .tag { flex: none; display: flex; align-items: center; padding: 0 1.4vw 0 2.6vw; background: #d93b3b; color: #fff;
    font-weight: 700; font-size: 1.1vw; letter-spacing: 0.12em; text-transform: uppercase; text-shadow: none; }
  #news .lane { position: relative; flex: 1; overflow: hidden; }
  #news-track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; white-space: nowrap;
    will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  #news-track span { font-size: 1.45vw; }
  #news-track .src { color: var(--accent); font-weight: 700; font-size: 1.05vw; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 0.7vw; }
  #news-track .sep { color: rgba(255, 255, 255, 0.35); margin: 0 1.6vw; }
  /* Chromecast: a TV corta um pouco a base da imagem (overscan); a barra sobe e o fundo dela desce até a borda */
  .lite #news { bottom: 2.8vh; box-shadow: 0 2.8vh 0 #0b0e13; }
  .lite body.has-news #left { bottom: calc(8.8vh + 2.5vh); }
  /* no modo leve a barra não rola: mostra uma manchete por vez */
  .lite #news-track { position: static; height: 100%; padding-left: 1.6vw; overflow: hidden; will-change: auto; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>
  <div id="shade2"></div>
  <div id="left">
    <header>
      <div class="when">
        <div class="hello" id="hello"></div>
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
      <div id="weather"></div>
    </header>

    <div id="panel">
      <div class="card" id="agenda"><div class="lbl">Agenda de hoje</div><span class="pg" id="agenda-pg"></span><div id="events"></div></div>
      <div class="card hidden" id="menu-card"><div class="lbl">Cardápio de hoje</div><div id="menu"></div></div>
    </div>
    <div class="card hidden" id="gospel-card">
      <div class="gh"><div class="lbl">Evangelho do dia</div><span id="gospel-ref"></span></div>
      <div id="gospel-day"></div>
      <div id="gospel-text"></div>
    </div>

    <div class="card hidden" id="spotify-card" style="flex: none">
      <div class="np">
        <img id="np-art" alt="">
        <div class="np-info">
          <h2 id="np-label">Tocando agora</h2>
          <div class="np-title" id="np-title"></div>
          <div class="np-artist" id="np-artist"></div>
          <div class="np-bar"><div id="np-progress"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="verse" class="hidden"><div class="vt"></div><div class="vr"></div></div>
  <div id="status"></div>
  <div id="news" class="hidden"><div class="tag">Notícias</div><div class="lane"><div id="news-track"></div></div></div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var CONFIG = {
    api: params.get("api") || "",
    token: params.get("token") || "",
    pessoa: (params.get("pessoa") || "familia").toLowerCase(),
    lat: params.get("lat") || "",
    lon: params.get("lon") || "",
    cidade: params.get("cidade") || "",
    days: 5,
    refreshDataMs: 5 * 60 * 1000,
    refreshWeatherMs: 30 * 60 * 1000,
    photoEveryMs: 45 * 1000
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  var WEEK = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var WEEK_SHORT = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho",
                "agosto", "setembro", "outubro", "novembro", "dezembro"];

  // ---------- relógio ----------
  var profileName = "";
  function tick() {
    var now = new Date(), h = now.getHours();
    $("clock").textContent = hm(now);
    $("date").textContent = WEEK[now.getDay()] + ", " + now.getDate() + " de " + MONTHS[now.getMonth()];
    var greet = h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
    $("hello").textContent = greet + (profileName ? ", " + profileName : "");
    if (now.getSeconds() === 0) { updateTrash(); updateVerse(); }
  }

  // ---------- lembrete do lixo ----------
  // trash: { dias: ['segunda', 'sexta'], hora: '07:30', vespera: '17:00', ate: '08:00' } (vespera e ate são opcionais)
  var trashCfg = null, trashKey = "";
  function toMin(s, def) {
    var m = /^(\d{1,2})(?:[:h](\d{2}))?$/.exec(String(s == null ? "" : s).trim());
    return m ? (+m[1]) * 60 + (+(m[2] || 0)) : def;
  }
  function fmtHour(min) { var h = Math.floor(min / 60), m = min % 60; return h + "h" + (m ? pad(m) : ""); }
  function weekdayIdx(d) {
    if (typeof d === "number") return d >= 0 && d <= 6 ? d : -1;
    var s = String(d).toLowerCase().trim().slice(0, 3).replace("á", "a").replace("ç", "c");
    return ["dom", "seg", "ter", "qua", "qui", "sex", "sab"].indexOf(s);
  }
  function setTrash(cfg) {
    trashCfg = null;
    if (cfg && cfg.dias) {
      var dias = [].concat(cfg.dias).map(weekdayIdx).filter(function (d) { return d >= 0; });
      var hora = toMin(cfg.hora, 7 * 60 + 30);
      if (dias.length) trashCfg = { dias: dias, hora: hora, vespera: toMin(cfg.vespera, 17 * 60), ate: toMin(cfg.ate, hora + 30) };
    }
    trashKey = "";
    updateTrash();
  }
  // "amanha" na véspera (a partir de "vespera"), "hoje" no dia (até "ate"), ou null
  function trashState(cfg, now) {
    if (!cfg) return null;
    var wd = now.getDay(), min = now.getHours() * 60 + now.getMinutes();
    if (cfg.dias.indexOf(wd) !== -1 && min < cfg.ate) return { when: "hoje", late: min >= cfg.hora };
    if (cfg.dias.indexOf((wd + 1) % 7) !== -1 && min >= cfg.vespera) return { when: "amanha" };
    return null;
  }
  var TRASH_ICON = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M5.5 6l1 14h11l1-14M10 10v6M14 10v6"/></svg>';
  function updateTrash() {
    var st = trashState(trashCfg, new Date());
    var key = st ? st.when + (st.late ? "-late" : "") : "";
    if (key === trashKey) return;
    trashKey = key;
    var el = $("trash");
    if (!st) { if (el) { el.parentNode.removeChild(el); fitAll(); } return; }
    if (!el) {
      el = document.createElement("div");
      el.id = "trash";
      $("left").insertBefore(el, $("panel"));
    }
    var hour = fmtHour(trashCfg.hora), t1, t2;
    if (st.when === "amanha") {
      t1 = "Amanhã cedo tem coleta de lixo";
      t2 = "Coloque o lixo para fora hoje à noite. O caminhão passa por volta das " + hour + ".";
    } else if (!st.late) {
      t1 = "Hoje tem coleta de lixo!";
      t2 = "O caminhão passa por volta das " + hour + ". Já colocou o lixo para fora?";
    } else {
      t1 = "O caminhão do lixo está passando";
      t2 = "Se o lixo ainda não está lá fora, ainda dá tempo!";
    }
    el.className = st.when === "hoje" ? "today" : "";
    el.innerHTML = TRASH_ICON + '<div><div class="t1">' + esc(t1) + '</div><div class="t2">' + esc(t2) + "</div></div>";
    fitAll(); // o card de baixo ficou menor
  }

  // ---------- agenda ----------
  // Só o dia de hoje. Quando não resta mais nada hoje (ou não havia nada), mostra também amanhã.
  // Sem "+ N eventos": o que não couber vai para a próxima página (ver layoutAgenda).
  function eventsOn(events, day) {
    var end = new Date(day); end.setDate(end.getDate() + 1);
    return events.filter(function (ev) {
      var s = new Date(ev.start), e = new Date(ev.end || ev.start);
      return (s < end && e > day) || (+s === +e && s >= day && s < end);
    }).sort(function (a, b) {
      if (!!a.allDay !== !!b.allDay) return a.allDay ? -1 : 1;
      return new Date(a.start) - new Date(b.start);
    });
  }
  function eventRow(ev, now) {

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function setNews(list) {
    news = (list || []).filter(function (n) { return n && n.title; });
    var on = news.length > 0;
    $("news").classList.toggle("hidden", !on);
    document.body.classList.toggle("has-news", on);
    if (!window.ResizeObserver) setTimeout(fitAll, 0);
    if (on && !newsRunning) runNews();
  }
  var newsIdx = 0, newsTimer = null;
  function runNews() {
    var track = $("news-track");
    if (!news.length) { newsRunning = false; return; }
    newsRunning = true;
    if (IS_CAST) {
      // modo leve: uma manchete por vez, trocando a cada 10 s, sem animação
      var n = news[newsIdx++ % news.length];
      track.innerHTML = (n.source ? '<span class="src">' + esc(n.source) + "</span>" : "") + "<span>" + esc(n.title) + "</span>";
      clearTimeout(newsTimer);
      newsTimer = setTimeout(runNews, 10000);
      return;
    }
    track.innerHTML = shuffle(news).slice(0, 30).map(function (n) {
      return (n.source ? '<span class="src">' + esc(n.source) + "</span>" : "") + "<span>" + esc(n.title) + '</span><span class="sep">•</span>';
    }).join("");
    var lane = track.parentNode.clientWidth, w = track.scrollWidth;
    var speed = window.innerWidth / 24; // pixels por segundo (uma tela a cada 24 s)
    track.style.transition = "none";
    track.style.transform = "translate3d(" + lane + "px,0,0)";
    void track.offsetWidth; // aplica a posição inicial antes de animar
    track.style.transition = "transform " + ((lane + w) / speed).toFixed(1) + "s linear";
    track.style.transform = "translate3d(" + (-w) + "px,0,0)";
  }
  $("news-track").addEventListener("transitionend", runNews);

  // ---------- tempo (Open-Meteo, sem chave) ----------
  // Ícones desenhados (SVG) em vez de emojis: o Chromecast antigo não tem fonte de emoji.
  var SUN = '<circle cx="12" cy="12" r="4.5" fill="#ffc94d"/><g stroke="#ffc94d" stroke-width="1.8" stroke-linecap="round">' +
    '<path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>';
  var CLOUD = function (c) { return '<path d="M7 19h10.5a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6-1.2A4.6 4.6 0 0 0 7 19z" fill="' + (c || "#dfe6ef") + '"/>'; };
  var DROPS = '<g stroke="#6cb6ff" stroke-width="1.8" stroke-linecap="round"><path d="M9 20.5l-1 2.5M13 20.5l-1 2.5M17 20.5l-1 2.5"/></g>';
  var ICONS = {
    sol: SUN,
    poucas: '<g transform="translate(-3 -3) scale(.75)">' + SUN + '</g><g transform="translate(2 1) scale(.9)">' + CLOUD() + '</g>',
    nublado: CLOUD(),
    neblina: '<g stroke="#c9d1dc" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>',
    garoa: '<g transform="translate(0 -3)">' + CLOUD() + '</g><g stroke="#6cb6ff" stroke-width="1.6" stroke-linecap="round"><path d="M10 18.5v1.5M15 18.5v1.5"/></g>',
    chuva: '<g transform="translate(0 -3)">' + CLOUD("#b9c4d2") + '</g>' + DROPS,
    neve: '<g transform="translate(0 -3)">' + CLOUD() + '</g><g fill="#fff"><circle cx="9" cy="20" r="1.2"/><circle cx="13" cy="21.5" r="1.2"/><circle cx="17" cy="20" r="1.2"/></g>',
    raio: '<g transform="translate(0 -3)">' + CLOUD("#9aa6b6") + '</g><path d="M13 15l-3 5h3l-1.5 4 4.5-6h-3l1.5-3z" fill="#ffc94d"/>'
  };
  function icon(name) {
    return '<svg class="wi" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + "</svg>";
  }
  function wmo(code) {
    if (code === 0) return [icon("sol"), "céu limpo"];
    if (code <= 2) return [icon("poucas"), "poucas nuvens"];
    if (code === 3) return [icon("nublado"), "nublado"];
    if (code <= 48) return [icon("neblina"), "neblina"];
    if (code <= 57) return [icon("garoa"), "garoa"];
    if (code <= 67) return [icon("chuva"), "chuva"];
    if (code <= 77) return [icon("neve"), "neve"];
    if (code <= 82) return [icon("chuva"), "pancadas"];
    return [icon("raio"), "tempestade"];
  }
  function loadWeather() {
    if (!CONFIG.lat || !CONFIG.lon) { $("weather").innerHTML = ""; return; }
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.lat + "&longitude=" + CONFIG.lon +
      "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=4";
    return fetch(url).then(function (r) { return r.json(); }).then(function (w) {
      var now = wmo(w.current.weather_code), d = w.daily, days = "";
      for (var i = 1; i < d.time.length; i++) {
        var dt = new Date(d.time[i] + "T12:00:00");
        days += "<span>" + WEEK_SHORT[dt.getDay()] + " " + wmo(d.weather_code[i])[0] + " " + Math.round(d.temperature_2m_max[i]) + "°</span>";
      }
      $("weather").innerHTML =
        '<div class="now">' + now[0] + " " + Math.round(w.current.temperature_2m) + "°</div>" +
        '<div class="range"><div>' + (CONFIG.cidade ? esc(CONFIG.cidade) + " · " : "") + now[1] + "</div><div>" +
        Math.round(d.temperature_2m_min[0]) + "° / " + Math.round(d.temperature_2m_max[0]) + "° · chuva " +
        d.precipitation_probability_max[0] + "%</div></div>" +
        '<div class="days">' + days + "</div>";
      fitAll(); // o cabeçalho mudou de altura
    }).catch(function () { /* mantém o último tempo exibido */ });
  }

  // ---------- dados ----------
  function apiUrl(extra) {
    var q = new URLSearchParams({ token: CONFIG.token, pessoa: CONFIG.pessoa, days: CONFIG.days, _: Date.now() });
    Object.keys(extra || {}).forEach(function (k) { q.set(k, extra[k]); });
    return CONFIG.api + (CONFIG.api.indexOf("?") === -1 ? "?" : "&") + q.toString();
  }

  var lastOk = 0;
  function loadData() {
    if (!CONFIG.api) { render(demoData(CONFIG.pessoa)); return; }
    fetch(apiUrl()).then(function (r) { return r.json(); }).then(function (data) {
      if (data.error) throw new Error(data.error);
      render(data);
    }).catch(function (err) {
      $("status").textContent = "sem conexão com a agenda" + (lastOk ? " · última atualização " + hm(new Date(lastOk)) : "") + " · " + err.message;
    });
  }

  function render(data) {
    lastData = data;
    profileName = data.name || "";
    tick();
    renderMenu(data.menu);
    setPhotos(data.photos || []);
    setSpotify(data.spotify);
    setNews(data.news);
    setTrash(data.trash);
    if (data.spotifyDemo) { np = Object.assign({ at: Date.now() }, data.spotifyDemo); renderNowPlaying(); }
    refreshPanel();
    lastOk = Date.now();
    // só aparece algo quando há um problema (ou nos dados de exemplo)
    $("status").textContent = (data.warnings && data.warnings.length ? "aviso: " + data.warnings.join(" | ") : "") ||
      (data.demo ? "dados de exemplo" : "");
  }

  // ---------- dados de exemplo (sem "api") ----------
  function demoData(pessoa) {
    var t = startOfDay(new Date());
    function at(o, h, m) { var d = new Date(t); d.setDate(d.getDate() + o); d.setHours(h, m || 0); return d.toISOString(); }
    function day(o) { var d = new Date(t); d.setDate(d.getDate() + o); return d.toISOString(); }
    var C = { familia: "#4fb38b", pessoa1: "#7aa2f7", pessoa2: "#e8768a", pessoa3: "#f2b544" };
    var events = [
      { who: "pessoa3", title: "Natação", start: at(0, 8, 30), end: at(0, 9, 30) },
      { who: "familia", title: "Almoço em família", start: at(0, 12, 30), end: at(0, 14) },
      { who: "pessoa2", title: "Pilates", start: at(0, 18), end: at(0, 19) },
      { who: "pessoa1", title: "Aula de inglês online com a professora particular", start: at(0, 20), end: at(0, 21) },
      { who: "familia", title: "Aniversário", start: day(1), end: day(2), allDay: true },
      { who: "pessoa1", title: "Dentista", start: at(1, 10), end: at(1, 11) },
      { who: "pessoa3", title: "Prova de matemática", start: day(2), end: day(3), allDay: true },
      { who: "familia", title: "Reunião de pais na escola", start: at(2, 19), end: at(2, 20) },
      { who: "pessoa2", title: "Consulta médica", start: at(3, 15), end: at(3, 16) },
      { who: "pessoa1", title: "Futebol", start: at(3, 18, 30), end: at(3, 20) }
    ];
    var names = { familia: "", pessoa1: "Pessoa 1", pessoa2: "Pessoa 2", pessoa3: "Pessoa 3" };
    var p = names.hasOwnProperty(pessoa) ? pessoa : "familia";
    var photo = function (seed) { return { url: "https://picsum.photos/seed/" + seed + "/1280/800", w: 1280, h: 800 }; };
    var tallPhoto = function (seed, t) { return { url: "https://picsum.photos/seed/" + seed + "/600/800", w: 600, h: 800, t: t }; };
    return {
      name: names[p],
      events: events.filter(function (e) { return p === "familia" || e.who === p || e.who === "familia"; })
                    .map(function (e) { e.color = C[e.who]; return e; }),
      menu: [
        { weekday: 0, almoco: "Churrasco", jantar: "Sopa de legumes" },
        { weekday: 1, almoco: "Frango grelhado", jantar: "Omelete" },
        { weekday: 2, almoco: "Strogonoff", jantar: "Sanduíche natural" },
        { weekday: 3, almoco: "Feijoada", jantar: "Caldo verde" },
        { weekday: 4, almoco: "Peixe assado", jantar: "Panqueca" },
        { weekday: 5, almoco: "Lasanha", jantar: "Pizza caseira" },
        { weekday: 6, almoco: "Macarronada", jantar: "Lanche" }
      ],
      photos: [photo("familia1"), tallPhoto("praia2", Date.UTC(2024, 0, 15)), tallPhoto("sitio4", Date.UTC(2025, 6, 10)), photo("parque3")],
      news: [
        { source: "Esportes", title: "Time vence fora de casa e sobe na tabela" },
        { source: "Esportes", title: "Técnico confirma escalação para o clássico de domingo" },
        { source: "Economia", title: "Bolsa fecha em alta puxada por bancos" },
        { source: "Economia", title: "Dólar recua e termina o dia abaixo de R$ 5" },
        { source: "Esportes", title: "Seleção divulga convocados para as eliminatórias" },
        { source: "Economia", title: "Inflação do mês vem abaixo do esperado" }
      ],
      spotifyDemo: { playing: true, title: "Nome da música", artist: "Artista", image: null, progressMs: 95000, durationMs: 210000 },
      trash: { dias: ["segunda", "sexta"], hora: "07:30" },
      gospel: { ref: "Mt 25,1-13", day: "Exemplo: Domingo do Tempo Comum", text: "Naquele tempo, disse Jesus a seus discípulos esta parábola: “O Reino dos Céus é semelhante a dez virgens que, tomando as suas lâmpadas, saíram ao encontro do esposo. Cinco delas eram imprudentes, e cinco, prudentes. As imprudentes, tomando as suas lâmpadas, não levaram azeite consigo. As prudentes, porém, levaram azeite em suas vasilhas, com as lâmpadas. E, tardando o esposo, cochilaram todas e adormeceram. Mas à meia-noite ouviu-se um clamor: ‘Aí vem o esposo! Saí ao seu encontro!’ Então todas aquelas virgens se levantaram e prepararam as suas lâmpadas. E as imprudentes disseram às prudentes: ‘Dai-nos do vosso azeite, porque as nossas lâmpadas se apagam’. Mas as prudentes responderam: ‘Não seja caso que nos falte a nós e a vós; ide antes aos que o vendem e comprai-o para vós’. E, tendo elas ido comprá-lo, chegou o esposo, e as que estavam preparadas entraram com ele para as bodas, e fechou-se a porta. E depois chegaram também as outras virgens, dizendo: ‘Senhor, Senhor, abre-nos!’ E ele, respondendo, disse: ‘Em verdade vos digo que vos não conheço’. Vigiai, pois, porque não sabeis o dia nem a hora”." },
      demo: true
    };
  }

  // ---------- Chromecast: modo leve e receptor aberto ----------
  if (IS_CAST) {
    document.documentElement.className += " lite";
    // a memória do Chromecast antigo é pequena: recarrega a página a cada hora para liberar tudo
    setTimeout(function () { if (navigator.onLine !== false) location.reload(); }, 3600 * 1000);
  }
  // Só quando a página é o próprio app do Chromecast. Enviada pelo catt (cast_site), ela roda
  // dentro de outro receptor, e iniciar um segundo receptor ali só atrapalha.
  if (/CrKey/.test(navigator.userAgent) && window.top === window) {
    var s = document.createElement("script");
    s.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
    s.onload = function () {
      cast.framework.CastReceiverContext.getInstance().start({ disableIdleTimeout: true, skipPlayersLoad: true });
    };
    document.head.appendChild(s);
  }

  // ---------- inicialização ----------
  updateVerse();
  tick();
  setInterval(tick, 1000);
  loadData();
  setInterval(loadData, CONFIG.refreshDataMs);
  loadWeather();
  setInterval(loadWeather, CONFIG.refreshWeatherMs);
  // recarrega uma vez por dia de madrugada (TVs fracas acumulam memória)
  setInterval(function () { var n = new Date(); if (n.getHours() === 4 && n.getMinutes() === 0) location.reload(); }, 60000);
})();
</script>
